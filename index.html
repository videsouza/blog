<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vinicius A. de Souza</title>
    <!-- Font Awesome para ícones sociais -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        /* Reset básico e fonte */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #fafafa;
            color: #1e1e1e;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2rem 1.5rem;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        /* Container principal */
        .container {
            max-width: 720px;
            width: 100%;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        /* Título – nome */
        .nome {
            font-size: 3.5rem;
            font-weight: 600;
            letter-spacing: -0.02em;
            margin-bottom: 0.25rem;
            color: #0a0a0a;
        }

        .subtitulo {
            font-size: 1.1rem;
            font-weight: 400;
            color: #6b6b6b;
            margin-bottom: 3rem;
            border-bottom: 1px solid #e0e0e0;
            padding-bottom: 1.5rem;
            width: 100%;
            max-width: 400px;
        }

        /* Grade de links – projetos / arquivos */
        .links-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 1rem;
            width: 100%;
            margin-bottom: 3rem;
        }

        .link-card {
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            padding: 0.75rem 1.6rem;
            background: #ffffff;
            border: 1px solid #eaeaea;
            border-radius: 40px;
            text-decoration: none;
            color: #1e1e1e;
            font-size: 1rem;
            font-weight: 500;
            transition: all 0.2s ease;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.02);
        }

        .link-card i {
            font-size: 1.1rem;
            color: #4a4a4a;
            transition: color 0.2s;
        }

        .link-card:hover {
            background: #f3f3f3;
            border-color: #c0c0c0;
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.04);
        }

        .link-card:hover i {
            color: #0a0a0a;
        }

        /* Rodapé */
        footer {
            width: 100%;
            max-width: 720px;
            margin-top: 2rem;
            padding-top: 1.5rem;
            border-top: 1px solid #e8e8e8;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
            color: #6b6b6b;
        }

        .footer-copy {
            letter-spacing: 0.01em;
        }

        .footer-social {
            display: flex;
            gap: 1.2rem;
            align-items: center;
        }

        .footer-social a {
            color: #6b6b6b;
            text-decoration: none;
            transition: color 0.2s, transform 0.2s;
            font-size: 1.2rem;
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
        }

        .footer-social a:hover {
            color: #0a0a0a;
            transform: translateY(-1px);
        }

        .footer-social .label {
            font-size: 0.85rem;
            font-weight: 400;
            color: #8a8a8a;
        }

        /* Responsivo */
        @media (max-width: 540px) {
            .nome {
                font-size: 2.4rem;
            }
            .subtitulo {
                font-size: 0.95rem;
                margin-bottom: 2rem;
                padding-bottom: 1rem;
            }
            .link-card {
                padding: 0.6rem 1.2rem;
                font-size: 0.9rem;
            }
            footer {
                flex-direction: column;
                gap: 0.8rem;
                text-align: center;
                padding-top: 1.2rem;
            }
            .footer-social {
                gap: 1rem;
                flex-wrap: wrap;
                justify-content: center;
            }
            .footer-social .label {
                display: none;
            }
        }

        @media (max-width: 400px) {
            .nome {
                font-size: 2rem;
            }
            .links-grid {
                gap: 0.6rem;
            }
            .link-card {
                padding: 0.5rem 1rem;
                font-size: 0.85rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Título principal -->
        <h1 class="nome">Vinicius A. de Souza</h1>
        <p class="subtitulo">Design &amp; Desenvolvimento</p>

        <!-- Links para projetos / arquivos -->
        <div class="links-grid">
            <a href="#" class="link-card">
                <i class="fas fa-folder-open"></i> Projeto Alpha
            </a>
            <a href="#" class="link-card">
                <i class="fas fa-file-code"></i> Repositório
            </a>
            <a href="#" class="link-card">
                <i class="fas fa-palette"></i> Design System
            </a>
            <a href="#" class="link-card">
                <i class="fas fa-archive"></i> Arquivos
            </a>
            <!-- Adicione ou remova links conforme necessário -->
        </div>

        <!-- Rodapé -->
        <footer>
            <span class="footer-copy">&copy; 2026 Vinicius A. de Souza</span>
            <div class="footer-social">
                <a href="mailto:vinicius@example.com" aria-label="E-mail">
                    <i class="fas fa-envelope"></i>
                    <span class="label">E-mail</span>
                </a>
                <a href="https://linkedin.com/in/vinicius" target="_blank" aria-label="LinkedIn">
                    <i class="fab fa-linkedin-in"></i>
                    <span class="label">LinkedIn</span>
                </a>
            </div>
        </footer>
    </div>

</body>
</html>
