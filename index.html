<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vinicius A. de Souza</title>
    <!-- Font Awesome para ícones sociais -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        /* Reset e base */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #fafafa;
            color: #1e1e1e;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2rem 1.5rem;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 560px;
            width: 100%;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        /* Título */
        .nome {
            font-size: 3.2rem;
            font-weight: 600;
            letter-spacing: -0.02em;
            margin-bottom: 0.3rem;
            color: #0a0a0a;
        }

        .subtitulo {
            font-size: 1rem;
            font-weight: 400;
            color: #6b6b6b;
            margin-bottom: 2.8rem;
            border-bottom: 1px solid #e0e0e0;
            padding-bottom: 1.2rem;
            width: 100%;
            max-width: 320px;
        }

        /* Lista de links – vertical, sem botão */
        .links-list {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
            width: 100%;
            margin-bottom: 3rem;
            list-style: none;
        }

        .links-list li {
            width: 100%;
            max-width: 300px;
        }

        .links-list a {
            display: inline-block;
            padding: 0.4rem 0.8rem;
            font-size: 1.05rem;
            font-weight: 450;
            color: #2c2c2c;
            text-decoration: none;
            border-radius: 4px;
            transition: all 0.2s ease;
            border-bottom: 1px solid transparent;
            /* reserva para o hover */
            letter-spacing: 0.01em;
        }

        /* Efeito de destaque no hover */
        .links-list a:hover {
            color: #000000;
            background-color: rgba(0, 0, 0, 0.04);
            border-bottom-color: #1e1e1e;
            transform: translateX(4px);
            /* pequeno deslocamento */
        }

        /* Ícone opcional (mantém alinhamento) */
        .links-list a i {
            margin-right: 0.6rem;
            font-size: 0.95rem;
            color: #6b6b6b;
            transition: color 0.2s;
            width: 1.2rem;
            display: inline-block;
            text-align: center;
        }

        .links-list a:hover i {
            color: #0a0a0a;
        }

        /* Rodapé */
        footer {
            width: 100%;
            max-width: 560px;
            margin-top: 1.5rem;
            padding-top: 1.5rem;
            border-top: 1px solid #e8e8e8;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
            color: #6b6b6b;
        }

        .footer-copy {
            letter-spacing: 0.01em;
        }

        .footer-social {
            display: flex;
            gap: 1.2rem;
            align-items: center;
        }

        .footer-social a {
            color: #6b6b6b;
            text-decoration: none;
            transition: color 0.2s, transform 0.2s;
            font-size: 1.1rem;
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
        }

        .footer-social a:hover {
            color: #0a0a0a;
            transform: translateY(-1px);
        }

        .footer-social .label {
            font-size: 0.85rem;
            font-weight: 400;
            color: #8a8a8a;
        }

        /* Responsivo */
        @media (max-width: 480px) {
            .nome {
                font-size: 2.4rem;
            }
            .subtitulo {
                font-size: 0.9rem;
                margin-bottom: 2rem;
                padding-bottom: 0.8rem;
            }
            .links-list a {
                font-size: 0.95rem;
                padding: 0.3rem 0.6rem;
            }
            .links-list a i {
                font-size: 0.85rem;
                width: 1rem;
            }
            footer {
                flex-direction: column;
                gap: 0.6rem;
                text-align: center;
                padding-top: 1rem;
            }
            .footer-social {
                gap: 0.8rem;
                flex-wrap: wrap;
                justify-content: center;
            }
            .footer-social .label {
                display: none;
            }
        }

        @media (max-width: 360px) {
            .nome {
                font-size: 2rem;
            }
            .links-list {
                gap: 0.6rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Título -->
        <h1 class="nome">VINICIVS</h1>
        <p class="subtitulo">SILENTIVM RATIOQUE</p>

        <!-- Links empilhados verticalmente, sem botão -->
        <ul class="links-list">
            <li>
                <a href="https://doi.org/10.5281/zenodo.22692615"><img src="https://zenodo.org/badge/DOI/10.5281/zenodo.22692615.svg" alt="DOI"> 
                </a>

            </li>
            <li>
                <a href="https://doi.org/10.5281/zenodo.22692615">
                    <i class="fa fa-book fa-fw"></i> Guia de materiais de gestão documental
                </a>
            </li>
            <li>
                <a href="#">
                    <i class="fas fa-palette"></i> Design System
                </a>
            </li>
            <li>
                <a href="#">
                    <i class="fas fa-archive"></i> Arquivos
                </a>
            </li>
            <!-- Adicione ou remova itens conforme necessário -->
        </ul>

        <!-- Rodapé -->
        <footer>
            <span class="footer-copy">&copy; 2026 Vinicius A. de Souza</span>
            <div class="footer-social">
                <a href="mailto:vinicius@example.com" aria-label="E-mail">
                    <i class="fas fa-envelope"></i>
                    <span class="label">E-mail</span>
                </a>
                <a href="https://linkedin.com/in/vinicius" target="_blank" aria-label="LinkedIn">
                    <i class="fab fa-linkedin-in"></i>
                    <span class="label">LinkedIn</span>
                </a>
            </div>
        </footer>
    </div>

    <!-- JS (apenas para feedback) -->
    <script>
        console.log('Site minimalista com links empilhados carregado.');
    </script>
</body>
</html>
